<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F7C74">
<title>You're offline · WellNest</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
         font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #F7FAFA; color: #102A2A; }
  main { max-width: 420px; text-align: center; }
  img { width: 88px; height: 88px; }
  h1 { font-size: 1.6rem; margin: 18px 0 8px; }
  p { font-size: 1.05rem; line-height: 1.5; color: #42605F; margin: 0 0 12px; }
  button { margin-top: 12px; min-height: 48px; padding: 0 28px; border: 0; border-radius: 12px; background: #0F7C74; color: #fff;
           font-size: 1.05rem; font-weight: 600; cursor: pointer; }
  button:focus-visible { outline: 3px solid #E4572E; outline-offset: 3px; }
  .sos { margin-top: 28px; padding: 14px 16px; border-radius: 12px; background: #FFF1EC; color: #8A2E12; font-size: 0.98rem; }
  .sos a { color: #8A2E12; font-weight: 700; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="WellNest">
  <h1>You're offline</h1>
  <p>WellNest needs the internet to show bookings, orders and live tracking. Check your Wi-Fi or mobile data.</p>
  <p id="status" aria-live="polite">We'll reconnect automatically when you're back online.</p>
  <button type="button" onclick="location.reload()">Try again</button>
  <div class="sos">In an emergency, call <a href="tel:112">112</a> (all emergencies) or <a href="tel:108">108</a> (ambulance).</div>
</main>
<script>
  window.addEventListener("online", function () { document.getElementById("status").textContent = "Back online — reloading…"; location.reload(); });
</script>
</body>
</html>
